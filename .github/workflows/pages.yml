name: Deploy Greenroom Guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat .deploy/site.part* | base64 --decode > /tmp/site.tar.gz
          echo "Expected archive SHA256: 00fe9f39790a5e7ef6ddf0d559dcb0c7974132677d3089790471415185e331ce"
          echo "Actual archive SHA256:"
          sha256sum /tmp/site.tar.gz
          echo "00fe9f39790a5e7ef6ddf0d559dcb0c7974132677d3089790471415185e331ce  /tmp/site.tar.gz" | sha256sum -c -
          gzip -t /tmp/site.tar.gz
          tar -tzf /tmp/site.tar.gz >/dev/null
          tar -xzf /tmp/site.tar.gz -C site --strip-components=1
          test -s site/index.html
          test -s site/ads.txt
          test -s site/sitemap.xml
          test -s site/robots.txt
          test -s site/assets/site.js
          test -s site/assets/style.css
          test -d site/guides
          echo "Published file count:"
          find site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
