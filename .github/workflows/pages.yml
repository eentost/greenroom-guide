name: Deploy Greenroom Guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          gzip -t .deploy/site.tar.gz
          tar -tzf .deploy/site.tar.gz >/dev/null
          tar -xzf .deploy/site.tar.gz -C site --strip-components=1
          test -s site/index.html
          test -s site/ads.txt
          test -s site/sitemap.xml
          test -s site/robots.txt
          test -d site/guides
          echo "Published files:"
          find site -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
