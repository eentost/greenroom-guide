name: Deploy Greenroom Guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and assemble website
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=".deploy/site.tar.gz"
          test -s "$ARCHIVE"
          echo "Archive metadata:"
          file "$ARCHIVE"
          ls -lh "$ARCHIVE"
          gzip -t "$ARCHIVE"
          tar -tzf "$ARCHIVE" > /tmp/site-files.txt
          echo "Archive entries:"
          sed -n '1,100p' /tmp/site-files.txt

          mkdir -p site
          if grep -qx 'index.html' /tmp/site-files.txt; then
            tar -xzf "$ARCHIVE" -C site
          else
            ROOT="$(awk -F/ 'NF > 1 {print $1; exit}' /tmp/site-files.txt)"
            test -n "$ROOT"
            grep -qx "${ROOT}/index.html" /tmp/site-files.txt
            tar -xzf "$ARCHIVE" -C site --strip-components=1
          fi

          test -s site/index.html
          echo "Published file count:"
          find site -type f | wc -l
          echo "SEO/support files:"
          for f in ads.txt robots.txt sitemap.xml; do
            if test -s "site/$f"; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
